oracle-db:
  image: gvenzl/oracle-xe:21-slim
  container_name: oracle-xe
  environment:
    ORACLE_PASSWORD: ${DB_PASSWORD}
  ports:
    - "1522:1521"
  volumes:
    - oracle-data:/opt/oracle/oradata
  networks:
    - academy-network
  healthcheck:
    test: ["CMD", "healthcheck.sh"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 60s

  academy-app:
    build: .
    container_name: academy-app
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      DB_HOST: oracle-xe
      DB_PORT: 1521
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - academy-network