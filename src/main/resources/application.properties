spring.application.name=academy-management-system

# ---- Oracle Database Connection ----
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1522}/${DB_SERVICE:XEPDB1}
spring.datasource.username=${DB_USERNAME:system}
spring.datasource.password=${DB_PASSWORD:YourNewPassword123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# ---- JWT ----
jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJWTThatMustBeAtLeast256BitsLong123456}

# ---- flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---- Server ----
server.port=8080
